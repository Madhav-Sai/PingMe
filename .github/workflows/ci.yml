name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install fping (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fping iputils-ping
      - run: pip install pytest
      - name: Unit tests
        run: python -m pytest -q
      - name: End-to-end smoke test
        run: python tests/smoke_test.py
